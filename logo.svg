<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>TraceMind logo</title>
<desc>A dark navy network graph of connected nodes with a glowing cyan dashed trace path threading through several nodes to a coral-highlighted problem node, above the text TraceMind and the subtitle Agentic Network Diagnostics</desc>
<style>
.edge{stroke:#0f1830;stroke-width:3.5;opacity:0.55}
.node{fill:#0f1830;opacity:0.75}
.tracepath{fill:none;stroke:#0891a8;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 9}
.tracenode{fill:#0891a8}
.problem{fill:#e85c47}
.ring{fill:none;stroke:#e85c47;stroke-width:3;opacity:0.5}
.title{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:48px;fill:#0f1830}
.sub{font-family:Arial,Helvetica,sans-serif;font-weight:500;font-size:18px;fill:#3d5266;letter-spacing:2px}
</style>

<g transform="translate(340,175)">
<line class="edge" x1="0" y1="-70" x2="120" y2="-40"/>
<line class="edge" x1="0" y1="-70" x2="-30" y2="10"/>
<line class="edge" x1="0" y1="-70" x2="20" y2="55"/>
<line class="edge" x1="120" y1="-40" x2="-30" y2="10"/>
<line class="edge" x1="120" y1="-40" x2="70" y2="35"/>
<line class="edge" x1="120" y1="-40" x2="20" y2="55"/>
<line class="edge" x1="-30" y1="10" x2="-120" y2="45"/>
<line class="edge" x1="-30" y1="10" x2="20" y2="55"/>
<line class="edge" x1="-120" y1="45" x2="20" y2="55"/>
<line class="edge" x1="70" y1="35" x2="20" y2="55"/>

<circle class="node" cx="0" cy="-70" r="14"/>
<circle class="node" cx="120" cy="-40" r="20"/>
<circle class="node" cx="-30" cy="10" r="11"/>
<circle class="node" cx="-120" cy="45" r="9"/>
<circle class="node" cx="70" cy="35" r="8"/>

<path class="tracepath" d="M-120 45 L-30 10 L0 -70 L70 35 L20 55"/>
<circle class="tracenode" cx="-120" cy="45" r="6"/>
<circle class="tracenode" cx="-30" cy="10" r="6"/>
<circle class="tracenode" cx="0" cy="-70" r="6"/>
<circle class="tracenode" cx="70" cy="35" r="6"/>

<circle class="ring" cx="20" cy="55" r="26"/>
<circle class="problem" cx="20" cy="55" r="18"/>
</g>

<text x="340" y="380" text-anchor="middle" class="title">TraceMind</text>
<text x="340" y="412" text-anchor="middle" class="sub">AGENTIC NETWORK DIAGNOSTICS</text>
</svg>
